schema: spec-driven

context: |
  Language: zh
  All artifacts must be written in zh.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Hi-agent — 用 Go 从零实现最小 Agent/Harness（对照 GeekAgent Day1–16 能力）。
  Roadmap: doc/开发方案-按Day.md
  Principles:
    - 实现语言：Go；工程结构 cmd/ + internal/（不按 Day 建目录）
    - Day 仅表示开发里程碑（见 doc/开发方案-按Day.md）
    - 只增量不推翻；每个里程碑可运行
    - history 即 OpenAI messages，零转换
    - 未知工具默认 deny；状态落在 .geekagent/
    - 变更命名推荐 day01-repl、day02-tool-loop …
    - 改代码前必读 docs/<模块>/功能逻辑.md 与 改动记录.md（见 AGENTS.md）


rules:
  proposal:
    - 写明对应 Day 编号与验收标准
    - 必须包含 Non-goals（不做边界）
  tasks:
    - 任务粒度可在半天内完成
    - 验收步骤单独列出，可手工跑通

operations:
  apply:
    guidance:
      - 优先对照 doc/开发方案-按Day.md 当日验收清单
      - 不提前实现后续 Day 的能力
  archive:
    guidance:
      - 归档后提醒打 git tag dayN
